# Publica FMTURING en GitHub Pages en cada push a main (DA-29).
# Si una prueba falla, no se publica.
name: Pruebas y publicación

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pruebas del motor
        run: dotnet test tests/FMTuring.Core.Tests/FMTuring.Core.Tests.csproj -c Release

      - name: Publicar el sitio
        run: dotnet publish src/FMTuring.Web/FMTuring.Web.csproj -c Release -o release

      - name: Ajustes para GitHub Pages
        run: |
          # El sitio vive en https://<usuario>.github.io/fmturing/
          sed -i 's#<base href="/" />#<base href="/fmturing/" />#' release/wwwroot/index.html
          # Las rutas /formal, /maquina, etc. funcionan al abrirlas directamente
          cp release/wwwroot/index.html release/wwwroot/404.html
          # Evita que GitHub oculte la carpeta _framework de Blazor
          touch release/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
